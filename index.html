<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bingo Ride</title>
<style>
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#f6f2e8; font-family:'Inter',system-ui,sans-serif; color:#2a2621;
  }
  .wrap{max-width:420px; padding:32px; text-align:center;}
  h1{font-family:'Roboto Slab',Georgia,serif; color:#1f3a2e; margin-bottom:6px;}
  p.sub{color:#726a5c; margin-top:0; margin-bottom:28px;}
  a.app{
    display:block; padding:18px 20px; margin-bottom:14px; background:#fff; border:1px solid #d8cdb8;
    border-radius:8px; text-decoration:none; color:#1f3a2e; font-weight:700; font-size:1.05rem;
    border-left:5px solid #8c3b2e;
  }
  a.app span{display:block; font-weight:400; font-size:.85rem; color:#726a5c; margin-top:3px;}
  a.app.disabled{opacity:.5; pointer-events:none; border-left-color:#c89b6d;}
</style>
</head>
<body>
  <div class="wrap">
    <h1>Bingo Ride</h1>
    <p class="sub">Choose an app</p>
    <a class="app" href="./Director/">
      Director
      <span>Sign-in, station signs, finish-line scanning</span>
    </a>
    <a class="app" href="./Rider/">
      Rider
      <span>Scan your card, mark stations, show your finish code</span>
    </a>
  </div>
</body>
</html>
