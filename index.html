<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Bingo Ride — Rider</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --pine:#1f3a2e;
    --pine-dark:#132720;
    --paper:#f6f2e8;
    --tan:#c89b6d;
    --barn:#8c3b2e;
    --barn-dark:#6e2e22;
    --ink:#2a2621;
    --line:#d8cdb8;
    --ok:#3f6b4a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Inter',system-ui,sans-serif; background:var(--paper); color:var(--ink);
  }
  h1,h2,h3{font-family:'Roboto Slab',Georgia,serif; margin:0 0 .3em;}
  header.top{
    background:var(--pine); color:#fff; padding:16px 18px; text-align:center;
  }
  header.top h1{font-size:1.25rem; margin:0;}
  header.top .tag{font-size:.72rem; color:var(--tan); text-transform:uppercase; letter-spacing:.12em; margin-top:2px;}
  main{max-width:480px; margin:0 auto; padding:18px 16px 60px;}
  .card{
    background:#fff; border:1px solid var(--line); border-radius:10px; padding:20px; margin-bottom:16px;
    box-shadow:0 1px 3px rgba(0,0,0,.05);
  }
  p{line-height:1.5;}
  .muted{color:#726a5c; font-size:.85rem;}
  button{font-family:inherit; cursor:pointer;}
  button.primary{
    width:100%; background:var(--barn); color:#fff; border:none; padding:16px; border-radius:8px;
    font-size:1.05rem; font-weight:700;
  }
  button.primary:active{background:var(--barn-dark);}
  button.secondary{
    width:100%; background:none; border:2px solid var(--pine); color:var(--pine); padding:14px; border-radius:8px;
    font-weight:700; font-size:1rem;
  }
  button.link{
    width:100%; background:none; border:none; color:#8c6f5c; font-size:.85rem; text-decoration:underline; padding:10px;
  }
  button:disabled{opacity:.4;}
  #video-wrap{position:relative; max-width:100%; margin:0 0 12px;}
  video{width:100%; border-radius:8px; border:2px solid var(--pine); display:block;}
  .warn{background:#fdecea; border:1px solid #e0a39b; color:#7a2b22; padding:10px 14px; border-radius:6px; font-size:.85rem; margin-bottom:12px;}
  .toast{
    background:#eaf3ec; border:1px solid #a9c9b2; color:#234; padding:12px 14px; border-radius:8px; font-size:.92rem;
    margin-bottom:14px; text-align:center; font-weight:600;
  }
  .progress-row{display:flex; gap:6px; justify-content:center; margin-bottom:6px;}
  .progress-row .dot{
    width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:.85rem; border:2px solid var(--line); color:#a89c86; background:#fbf8f2;
  }
  .progress-row .dot.done{background:var(--ok); border-color:var(--ok); color:#fff;}
  .progress-label{text-align:center; font-size:.8rem; color:#726a5c; margin-bottom:16px;}
  select{
    width:100%; padding:10px; border:1px solid var(--line); border-radius:6px; font-family:inherit; font-size:.95rem; margin-bottom:10px;
  }
  .card-name{font-family:'Roboto Slab',Georgia,serif; font-weight:700; color:var(--pine-dark); margin-bottom:6px; text-align:center;}
  .letters{display:grid; grid-template-columns:repeat(5,1fr); gap:4px; max-width:300px; margin:0 auto 4px;}
  .letters div{text-align:center; font-family:'Roboto Slab',Georgia,serif; color:var(--barn); font-weight:700;}
  .bcard{display:grid; grid-template-columns:repeat(5,1fr); gap:4px; max-width:300px; margin:0 auto 20px;}
  .bcard div{
    aspect-ratio:1; display:flex; align-items:center; justify-content:center; border:1px solid var(--line);
    border-radius:4px; font-weight:700; font-size:.95rem; background:#fbf8f2;
  }
  .bcard div.marked{background:var(--ok); color:#fff; border-color:var(--ok);}
  .bcard div.free{background:var(--tan); color:#fff; font-size:.7rem;}
  .finish-qr{display:flex; justify-content:center; padding:16px; background:#fff;}
  #qrScratch{position:absolute; left:-9999px; top:-9999px;}
  .rider-group{margin-bottom:26px;}
  .rider-group:last-child{margin-bottom:0;}
  .rider-group-name{
    font-family:'Roboto Slab',Georgia,serif; font-weight:700; color:#fff; background:var(--pine);
    padding:8px 12px; border-radius:6px; margin-bottom:14px; text-align:center;
  }
  .rider-pick-btn{
    display:block; width:100%; text-align:left; background:#fbf8f2; border:1px solid var(--line);
    border-radius:8px; padding:14px; margin-bottom:10px; font-weight:700; color:var(--pine-dark); font-size:1rem;
  }
  .rider-pick-btn span{display:block; font-weight:400; font-size:.8rem; color:#726a5c; margin-top:2px;}
</style>
</head>
<body>

<header class="top">
  <h1>Bingo Ride</h1>
  <div class="tag">Rider</div>
</header>

<main>

  <!-- ============ NO CARDS YET ============ -->
  <div class="card" id="noCardsView">
    <h2>Welcome!</h2>
    <p>Scan the QR code from the sign-in table to load your Bingo card(s) onto this phone.</p>
    <button class="primary" id="scanIssuanceBtn">Scan my card QR</button>
  </div>

  <!-- ============ MAIN DASHBOARD ============ -->
  <div id="mainView" style="display:none;">
    <div class="card" style="text-align:center;">
      <div class="muted" id="riderCountLabel"></div>
      <div class="progress-row" id="progressDots"></div>
      <div class="progress-label" id="progressLabel"></div>
      <button class="primary" id="scanStationBtn">Scan station QR</button>
    </div>

    <div class="card" id="cardsWrap"><!-- rendered by JS --></div>

    <div class="card" style="text-align:center;">
      <button class="secondary" id="addRiderBtn" style="margin-bottom:10px;">Add another rider's card</button>
      <button class="secondary" id="showFinishBtn">Show finish-line code</button>
    </div>

    <button class="link" id="startOverBtn">Start over (clear everyone's cards)</button>
  </div>

  <!-- ============ SCANNER (shared by both scan buttons) ============ -->
  <div class="card" id="scannerView" style="display:none;">
    <div id="video-wrap">
      <video id="scanVideo" muted playsinline></video>
    </div>
    <div id="cameraPickerWrap" style="display:none;">
      <select id="cameraSelect"></select>
    </div>
    <div id="cameraError" class="warn" style="display:none;"></div>
    <button class="secondary" id="cancelScanBtn">Cancel</button>
  </div>

  <div id="toastWrap"></div>

  <!-- ============ FINISH CODE ============ -->
  <div class="card" id="finishView" style="display:none;">
    <div id="finishPicker">
      <h2 style="text-align:center;">Whose finish code?</h2>
      <div id="finishRiderList"></div>
    </div>
    <div id="finishQRSection" style="display:none;">
      <h2 style="text-align:center;">Show this at the finish line</h2>
      <div class="finish-qr" id="finishQR"></div>
      <p class="muted" style="text-align:center;">Hold steady while the finish-line volunteer scans this.</p>
      <button class="secondary" id="backToPickerBtn" style="margin-bottom:10px;">Choose another rider</button>
    </div>
    <button class="secondary" id="closeFinishBtn">Back</button>
  </div>

</main>

<div id="qrScratch"></div>

<script type="module">
import * as BingoFormat from './bingo-format.js';

const STORE_KEY = 'bingoRiderState_v1';
const CAMERA_PREF_KEY = 'bingoRider_preferredCamera';

function defaultState(){
  return { riders: [], visitedStations: {} }; // riders: [{riderName, cards:[...]}]
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){ console.error('Failed to load saved state', e); }
  return defaultState();
}
function saveState(){ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
let state = loadState();

function showToast(msg){
  const wrap = document.getElementById('toastWrap');
  wrap.innerHTML = `<div class="toast">${msg}</div>`;
  setTimeout(()=>{ wrap.innerHTML=''; }, 3500);
}

// ---------- MAIN RENDER ----------
function renderAll(){
  const hasRiders = state.riders.length > 0;
  document.getElementById('noCardsView').style.display = hasRiders ? 'none' : 'block';
  document.getElementById('mainView').style.display = hasRiders ? 'block' : 'none';
  if(!hasRiders) return;

  const totalCards = state.riders.reduce((sum,r)=>sum+r.cards.length, 0);
  document.getElementById('riderCountLabel').textContent =
    state.riders.length === 1
      ? `${state.riders[0].riderName} — ${totalCards} card${totalCards>1?'s':''}`
      : `${state.riders.length} riders on this phone — ${totalCards} cards total`;

  // progress dots (shared — one scan at a station covers every rider on this phone)
  const visitedNums = Object.keys(state.visitedStations).map(Number);
  const dotsWrap = document.getElementById('progressDots');
  dotsWrap.innerHTML='';
  for(let s=1; s<=6; s++){
    const d = document.createElement('div');
    d.className = 'dot' + (visitedNums.includes(s) ? ' done' : '');
    d.textContent = s;
    dotsWrap.appendChild(d);
  }
  document.getElementById('progressLabel').textContent = `${visitedNums.length} of 6 stations scanned`;

  // cards, grouped by rider
  const wrap = document.getElementById('cardsWrap');
  wrap.innerHTML='';
  const allStations = Object.values(state.visitedStations);
  state.riders.forEach(rider=>{
    const group = document.createElement('div');
    group.className = 'rider-group';
    const nameEl = document.createElement('div');
    nameEl.className = 'rider-group-name';
    nameEl.textContent = state.riders.length > 1 ? rider.riderName : '';
    if(state.riders.length > 1) group.appendChild(nameEl);

    rider.cards.forEach(card=>{
      const { grid } = BingoFormat.markCard(card, visitedNums, allStations);
      const section = document.createElement('div');
      section.style.marginBottom = '22px';
      section.innerHTML = `
        <div class="card-name">${card.id}</div>
        <div class="letters"><div>B</div><div>I</div><div>N</div><div>G</div><div>O</div></div>
        <div class="bcard"></div>
      `;
      const bcardEl = section.querySelector('.bcard');
      grid.forEach((row, rIdx)=>{
        row.forEach((marked, cIdx)=>{
          const cell = document.createElement('div');
          const isFree = rIdx===2 && cIdx===2;
          if(isFree){ cell.classList.add('free'); cell.textContent='FREE'; }
          else if(marked) cell.classList.add('marked');
          bcardEl.appendChild(cell);
        });
      });
      group.appendChild(section);
    });
    wrap.appendChild(group);
  });
}

// ---------- SCANNING (shared logic for card QR and station QR) ----------
let scanner = null;
let QrScannerLib = null;
let scanMode = null; // 'issuance' | 'station'

function showCameraError(msg){
  const el = document.getElementById('cameraError');
  if(!msg){ el.style.display='none'; el.textContent=''; return; }
  el.style.display='block';
  el.textContent = msg;
}

async function populateCameraPicker(){
  const wrap = document.getElementById('cameraPickerWrap');
  const sel = document.getElementById('cameraSelect');
  try{
    const cameras = await QrScannerLib.listCameras(true);
    if(cameras.length < 2){ wrap.style.display='none'; return; }
    const saved = localStorage.getItem(CAMERA_PREF_KEY);
    sel.innerHTML = cameras.map(c=>`<option value="${c.id}">${c.label || 'Camera'}</option>`).join('');
    if(saved && cameras.some(c=>c.id===saved)) sel.value = saved;
    wrap.style.display = 'block';
  }catch(e){
    wrap.style.display='none';
  }
}
document.getElementById('cameraSelect').addEventListener('change', async (e)=>{
  localStorage.setItem(CAMERA_PREF_KEY, e.target.value);
  if(scanner){
    try{ await scanner.setCamera(e.target.value); }
    catch(err){ showCameraError('Could not switch camera: ' + err.message); }
  }
});

async function openScanner(mode){
  scanMode = mode;
  showCameraError(null);
  document.getElementById('scannerView').style.display = 'block';
  document.getElementById('mainView').style.display = 'none';
  document.getElementById('noCardsView').style.display = 'none';

  try{
    if(!QrScannerLib){
      const mod = await import('https://cdnjs.cloudflare.com/ajax/libs/qr-scanner/1.4.2/qr-scanner.min.js');
      QrScannerLib = mod.default;
    }
    if(!QrScannerLib.WORKER_PATH || !QrScannerLib.WORKER_PATH.startsWith('blob:')){
      const workerResp = await fetch('https://cdnjs.cloudflare.com/ajax/libs/qr-scanner/1.4.2/qr-scanner-worker.min.js');
      if(!workerResp.ok) throw new Error('Could not fetch the scanner worker script (are you online for this first load?)');
      const workerBlob = await workerResp.blob();
      QrScannerLib.WORKER_PATH = URL.createObjectURL(workerBlob);
    }

    const video = document.getElementById('scanVideo');
    const savedCamera = localStorage.getItem(CAMERA_PREF_KEY);
    scanner = new QrScannerLib(
      video,
      result => handleScan(result.data || result),
      {
        returnDetailedScanResult:true,
        highlightScanRegion:true,
        preferredCamera: savedCamera || 'environment'
      }
    );
    await scanner.start();
    await populateCameraPicker();
  }catch(err){
    console.error('Camera start failed', err);
    showCameraError('Camera failed to start: ' + (err && err.message ? err.message : err));
  }
}

function closeScanner(){
  if(scanner){ scanner.destroy(); scanner = null; }
  document.getElementById('scannerView').style.display = 'none';
  renderAll();
}

document.getElementById('scanIssuanceBtn').addEventListener('click', ()=>openScanner('issuance'));
document.getElementById('addRiderBtn').addEventListener('click', ()=>openScanner('issuance'));
document.getElementById('scanStationBtn').addEventListener('click', ()=>openScanner('station'));
document.getElementById('cancelScanBtn').addEventListener('click', closeScanner);

function handleScan(payload){
  const tag = payload.split(/[;|]/)[0];

  if(tag === 'BINGO1'){
    try{
      const data = BingoFormat.decodeIssuance(payload);
      const newCardIds = data.cards.map(c=>c.id).sort().join(',');
      const isDuplicate = state.riders.some(r =>
        r.riderName === data.riderName && r.cards.map(c=>c.id).sort().join(',') === newCardIds
      );
      if(isDuplicate){
        showCameraError(`${data.riderName}'s card(s) are already loaded on this phone.`);
        return;
      }
      if(state.riders.length >= 4){
        if(!confirm(`This phone already has ${state.riders.length} riders loaded. Add ${data.riderName} anyway?`)){
          return;
        }
      }
      state.riders.push({ riderName: data.riderName, cards: data.cards });
      saveState();
      closeScanner();
      showToast(`Loaded ${data.cards.length} card${data.cards.length>1?'s':''} for ${data.riderName}!`);
    }catch(e){
      showCameraError('That didn\'t look like a card QR code. Try again.');
    }
    return;
  }

  if(tag === 'STA1'){
    if(state.riders.length === 0){
      showCameraError('Scan a rider\'s card QR first before scanning a station.');
      return;
    }
    try{
      const station = BingoFormat.decodeStation(payload);
      state.visitedStations[station.station] = station;
      saveState();
      closeScanner();
      showToast(`Station ${station.station} marked for everyone on this phone!`);
    }catch(e){
      showCameraError('That didn\'t look like a station QR code. Try again.');
    }
    return;
  }

  showCameraError('Unrecognized QR code. Make sure you\'re scanning a Bingo Ride code.');
}

// ---------- FINISH CODE ----------
function openFinishView(){
  document.getElementById('mainView').style.display = 'none';
  document.getElementById('finishView').style.display = 'block';
  if(state.riders.length === 1){
    showFinishForRider(0);
  } else {
    showFinishPicker();
  }
}

function showFinishPicker(){
  document.getElementById('finishQRSection').style.display = 'none';
  document.getElementById('finishPicker').style.display = 'block';
  const list = document.getElementById('finishRiderList');
  list.innerHTML = '';
  state.riders.forEach((rider, idx)=>{
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'rider-pick-btn';
    btn.innerHTML = `${rider.riderName}<span>${rider.cards.length} card${rider.cards.length>1?'s':''}</span>`;
    btn.addEventListener('click', ()=>showFinishForRider(idx));
    list.appendChild(btn);
  });
}

function showFinishForRider(idx){
  const rider = state.riders[idx];
  const visitedNums = Object.keys(state.visitedStations).map(Number);
  const payload = BingoFormat.encodeFinish(rider.riderName, rider.cards.map(c=>c.id), visitedNums);
  const qrEl = document.getElementById('finishQR');
  qrEl.innerHTML = '';
  new QRCode(qrEl, { text: payload, width:260, height:260, correctLevel: QRCode.CorrectLevel.M });
  document.getElementById('finishPicker').style.display = 'none';
  document.getElementById('finishQRSection').style.display = 'block';
  document.getElementById('backToPickerBtn').style.display = state.riders.length > 1 ? 'block' : 'none';
}

document.getElementById('showFinishBtn').addEventListener('click', openFinishView);
document.getElementById('backToPickerBtn').addEventListener('click', showFinishPicker);
document.getElementById('closeFinishBtn').addEventListener('click', ()=>{
  document.getElementById('finishView').style.display = 'none';
  renderAll();
});

// ---------- START OVER ----------
document.getElementById('startOverBtn').addEventListener('click', ()=>{
  if(!confirm('Clear every rider\'s cards and station progress on this phone? Everyone will need to rescan their card QR to continue.')) return;
  state = defaultState();
  saveState();
  renderAll();
});

renderAll();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
